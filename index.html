<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<title>KidsMind Adventure – Learn, Play &amp; Explore</title>
<style>
:root{
  --bg1:#e8f4ff;--bg2:#fff4e0;--ink:#1f2750;--ink2:#4a5280;--card:#ffffff;
  --pri:#5b4bdb;--pri-d:#4435b8;--ok:#1b8f4c;--ok-bg:#dff7e8;--bad:#c2410c;--bad-bg:#ffe8dc;
  --sun:#ffb703;--sky:#2b9cf0;--mint:#12b886;--pink:#ff5d8f;--grape:#8e5cf7;--orange:#ff8a1f;
  --r:20px;--sh:0 6px 0 rgba(31,39,80,.12),0 10px 24px rgba(31,39,80,.10);
  --font:"Segoe UI","Nirmala UI","Noto Sans Devanagari","Mangal",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);font-size:18px;line-height:1.4;
  background:radial-gradient(circle at 10% 0%,#d9ecff 0,transparent 40%),radial-gradient(circle at 100% 20%,#ffe9c7 0,transparent 40%),linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;overscroll-behavior-y:contain}
#app{max-width:1100px;margin:0 auto;min-height:100%;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #ffbf00;outline-offset:2px}
h1,h2,h3{margin:.3em 0;line-height:1.2}
h1{font-size:clamp(1.6rem,5vw,2.4rem)}h2{font-size:clamp(1.3rem,4vw,1.7rem)}h3{font-size:1.15rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;min-width:52px;padding:10px 20px;border-radius:999px;background:var(--pri);color:#fff;font-weight:700;box-shadow:0 5px 0 var(--pri-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pri-d)}
.btn.alt{background:#fff;color:var(--pri);box-shadow:0 5px 0 #c9c4f3;border:2px solid #d9d5f7}
.btn.good{background:var(--ok);box-shadow:0 5px 0 #0f6b37}
.btn.warn{background:var(--orange);box-shadow:0 5px 0 #b55a00}
.btn.big{font-size:1.25rem;min-height:64px;padding:12px 32px}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{outline:4px solid var(--sun)}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 0;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(232,244,255,.97) 70%,rgba(232,244,255,0));flex-wrap:wrap}
.topbar .title{flex:1;min-width:120px;font-weight:800;font-size:1.15rem}
.iconbtn{width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:var(--sh);font-size:1.5rem;display:grid;place-items:center}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}.row.sb{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:28px;background:linear-gradient(135deg,#5b4bdb,#2b9cf0);color:#fff;box-shadow:var(--sh)}
.hero h1{color:#fff;margin:0}.hero p{margin:.3em 0 .8em}
.mascot{width:120px;height:120px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.agecard{border-radius:24px;padding:16px;color:#fff;text-align:left;box-shadow:var(--sh);display:block;width:100%;border:4px solid transparent;position:relative}
.agecard.sel{border-color:#fff;outline:5px solid var(--ink)}
.agecard b{font-size:1.15rem;display:block}.agecard small{opacity:.95;font-size:.95rem}
.agecard .em{font-size:2.4rem}
.a1{background:linear-gradient(135deg,#ff8fb1,#ff5d8f)}.a2{background:linear-gradient(135deg,#ffc247,#ff8a1f)}.a3{background:linear-gradient(135deg,#8e5cf7,#5b4bdb)}
.chip{padding:8px 16px;border-radius:999px;background:#fff;border:2px solid #d9d5f7;font-weight:700;min-height:44px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.gcard{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:14px;text-align:center;position:relative;display:flex;flex-direction:column;gap:6px;align-items:center;min-height:190px;border-top:8px solid var(--c,var(--pri))}
.gcard .ic{font-size:3rem;line-height:1}
.gcard b{font-size:1.05rem}
.gcard .tag{font-size:.8rem;background:#eef;border-radius:99px;padding:2px 10px;color:var(--ink2);font-weight:700}
.gcard .fav{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;font-size:1.4rem;background:#fff}
.stars{letter-spacing:2px;color:#e0a000;font-size:1.1rem}
.stat{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.7rem;color:var(--pri)}
.bar{height:16px;background:#e3e6f5;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));width:0;transition:width .3s}
.fb{padding:12px 16px;border-radius:16px;font-weight:700;margin:10px 0;border:3px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:#0b5a2c}
.fb.no{background:var(--bad-bg);border-color:var(--bad);color:#8a3105}
.fb.info{background:#eef3ff;border-color:#9bb4ff;color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;justify-content:center;min-height:60px;padding:10px 16px;border-radius:18px;background:#fff;border:3px solid #d9d5f7;box-shadow:0 4px 0 #d9d5f7;font-weight:800;font-size:1.2rem;text-align:center}
.opt:active{transform:translateY(2px)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);text-decoration:line-through}
.opt.sel{border-color:var(--pri);background:#efecff}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.big-em{font-size:clamp(2.4rem,9vw,4rem);line-height:1.1;word-break:break-word}
.modal{position:fixed;inset:0;background:rgba(20,24,60,.6);display:grid;place-items:center;z-index:100;padding:16px}
.modal>.card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:120;max-width:90vw}
.sec{margin:22px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;background:#fff6d6;border:2px solid var(--sun);border-radius:99px;padding:2px 12px;font-weight:800;font-size:.9rem}
.sim{background:#fff9e6;border:2px dashed #e0a000;border-radius:12px;padding:6px 12px;font-size:.9rem}
.cell{display:grid;place-items:center}
.board{display:grid;gap:3px;background:#cfd6f5;padding:6px;border-radius:16px;touch-action:manipulation}
.ref{touch-action:none;user-select:none;-webkit-user-select:none}
svg{max-width:100%}
.hid{display:none!important}
.sr{position:absolute;left:-9999px}
@media (max-width:560px){body{font-size:17px}.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.mascot{width:96px;height:96px}.btn{padding:8px 14px}.btn.big{padding:10px 22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.rm *{animation:none!important;transition:none!important}
</style>
</head>

<noscript>Please enable JavaScript to play KidsMind Adventure.</noscript>
<script>

const Store={ok:false,mem:{},init(){try{localStorage.setItem('__km','1');localStorage.removeItem('__km');this.ok=true}catch(e){this.ok=false}},

Store.init();
const KEY='kidsmind.adventure.v1';
function defState(){return{lang:'en',age:0,sound:false,music:false,rm:false,fav:[],recent:[],g:{},d:{},badges:{},daily:{},sess:0}}
let S=Object.assign(defState(),Store.get(KEY)||{});
S.g=S.g||{};S.d=S.d||{};S.badges=S.badges||{};S.fav=S.fav||[];S.recent=S.recent||[];S.daily=S.daily||{};
function save(){Store.set(KEY,S)}

const TX={};

function L(o){if(o==null)return'';if(typeof o==='string')return o;if(typeof o==='function')return o();if(Array.isArray(o))return(S.lang==='hi'?o[1]:o[0])||o[0];return o[S.lang]||o.en||''}
addTX({
tagline:['Learn, Play & Explore','सीखो, खेलो और खोजो'],

start:['Start Playing','खेलना शुरू करो'],pickAge:['Pick your age group','अपनी उम्र का समूह चुनो'],
allGames:['All Games','सभी खेल'],age1:['Little Explorers','छोटे खोजी'],age2:['Smart Adventurers','समझदार साहसी'],age3:['Brain Champions','दिमाग के चैंपियन'],
ages:['Ages {0}','उम्र {0}'],years:['{0} years','{0} वर्ष'],
cat_all:['All','सभी'],cat_brain:['Brain','दिमाग'],cat_lang:['Words','शब्द'],cat_sci:['Nature & Science','प्रकृति और विज्ञान'],cat_create:['Create','रचना'],cat_life:['Life Skills','जीवन कौशल'],
cont:['Continue Playing','खेल जारी रखो'],favs:['My Favourites','मेरे पसंदीदा'],noFavs:['Tap ♡ on a game to save it here.','किसी खेल पर ♡ दबाओ, वह यहाँ आ जाएगा।'],noRecent:['Games you play will show here.','जो खेल तुम खेलोगे वे यहाँ दिखेंगे।'],
daily:['Daily Challenge','आज की चुनौती'],dailyGo:['Play today’s challenge','आज की चुनौती खेलो'],dailyDone:['Done today! Play again if you like.','आज पूरी हुई! चाहो तो फिर खेलो।'],dailyTxt:['Today: {0}','आज: {0}'],
progress:['My Progress','मेरी प्रगति'],played:['Games played','खेले गए खेल'],levels:['Levels done','पूरे स्तर'],stars:['Stars','सितारे'],bests:['Personal bests','सर्वश्रेष्ठ स्कोर'],badges:['Badges','बैज'],
parent:['Parent Corner','अभिभावक कोना'],rec:['Recommended','सुझाया गया'],others:['More games for other ages','दूसरी उम्र के और खेल'],

howTo:['How to play','कैसे खेलें'],noScore:['Not played yet','अभी नहीं खेला'],

pDataTxt:['This app has no accounts, no ads, no tracking and needs no internet. It saves only game progress and settings in this browser on this device. Browser storage is not encrypted, and anyone using this device may be able to see it. Age is chosen as a group, never typed in.','इस ऐप में कोई खाता, विज्ञापन या ट्रैकिंग नहीं है और इंटरनेट की ज़रूरत नहीं। यह केवल खेल की प्रगति और सेटिंग इसी डिवाइस के ब्राउज़र में सहेजता है। ब्राउज़र स्टोरेज एन्क्रिप्टेड नहीं होता और इस डिवाइस का कोई भी उपयोगकर्ता उसे देख सकता है। उम्र समूह के रूप में चुनी जाती है, लिखी नहीं जाती।'],

pStoreNo:['Storage status: saving is blocked (for example private mode). The app works, but progress is forgotten when you close it.','स्टोरेज स्थिति: सहेजना बंद है (जैसे प्राइवेट मोड)। ऐप चलेगा, पर बंद करने पर प्रगति भूल जाएगी।'],
pReduced:['Calm mode (less motion)','शांत मोड (कम हलचल)'],
pReset:['Reset all progress','सारी प्रगति मिटाओ'],pResetQ:['Delete all stars, scores, badges and saved games on this device? This cannot be undone.','इस डिवाइस के सारे सितारे, स्कोर, बैज और सहेजे खेल मिटाएँ? यह वापस नहीं होगा।'],pResetDone:['Progress has been reset.','प्रगति मिटा दी गई।'],
pSafe:['Please play together and take breaks.','कृपया साथ खेलें और बीच-बीच में आराम करें।'],
b_first:['First Star','पहला सितारा'],b_s10:['10 Stars','10 सितारे'],b_s30:['30 Stars','30 सितारे'],b_s75:['75 Stars','75 सितारे'],b_try5:['Tried 5 games','5 खेल आज़माए'],b_try12:['Explorer: all 12 games','खोजी: सभी 12 खेल'],b_p5:['5 perfect levels','5 पूरे तीन-सितारा स्तर'],b_daily:['Daily Challenger','आज की चुनौती वाला'],
}
);
const DIFFN=['easy','medium','hard'];

/* ---- sound (off by default; optional) ---- */
const Snd={ctx:null,mt:null,mi:0,get(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}catch(e){}return this.ctx},
  tone(f,d,when,vol,type){const c=this.get();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;const t0=c.currentTime+(when||0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+0.05)}catch(e){}},
  play(k){if(!S.sound)return;const p={ok:[[660,.12,0],[880,.18,.1]],no:[[260,.2,0],[220,.25,.12]],win:[[523,.15,0],[659,.15,.14],[784,.15,.28],[1047,.3,.42]],tap:[[500,.06,0]],pop:[[700,.08,0]]}[k]||[];p.forEach(x=>this.tone(x[0],x[1],x[2]))},
  music(){clearInterval(this.mt);this.mt=null;if(!S.music)return;const sc=[262,294,330,392,440,392,330,294];this.mt=setInterval(()=>{if(document.hidden||!S.music)return;this.tone(sc[this.mi++%sc.length],.5,0,.03,'triangle')},700)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}});
function speak(text,lang){try{if(!('speechSynthesis' in window))return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||(S.lang==='hi'?'hi-IN':'en-IN');u.rate=.85;speechSynthesis.speak(u);return true}catch(e){return false}}

/* ---- tiny UI helpers ---- */
let toastT=0;
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hid');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add('hid'),2600)}

function feelStart(api){const stage=api.stage;let moodShown=false;
  const MOODS=[['😀','fl_happy','fl_tip_hap'],['😢','fl_sadf','fl_tip_sad'],['😠','fl_angry','fl_tip_ang'],['😟','fl_worried','fl_tip_wor'],['😴','fl_tired','fl_tip_tir']];
  let mood=-1;
  function intro(){api.status(t('fl_checkin'));api.onLang(intro);api.setProgress(0);
    stage.replaceChildren(h('div',{class:'card',style:{textAlign:'center'}},h('h2',null,t('fl_checkin')),h('div',{class:'row c'},MOODS.map((m,i)=>h('button',{class:'opt'+(mood===i?' sel':''),'aria-pressed':mood===i,style:{flexDirection:'column',minWidth:'92px'},onclick:()=>{mood=i;intro()}},h('span',{style:{fontSize:'2.2rem'},'aria-hidden':'true'},m[0]),t(m[1])))),
      mood>=0?h('p',{class:'fb info',role:'status'},t(MOODS[mood][2])):h('p',null,t('fl_tip_h')),h('p',{class:'sim'},t('fl_ci_note')),h('button',{class:'btn big',onclick:go},'▶ '+t('fl_ci_go'))))}
  function go(){const order=api.shuffle(FL.map((_,i)=>i));const box=h('div');stage.replaceChildren(box);
    Quiz(api,{rounds:order.length,box,title:()=>t('fl_q'),gen:i=>{const s=FL[order[i]];const idx=api.shuffle([0,1,2]);
      return{text:()=>L(s[1]),visual:()=>h('div',{style:{textAlign:'center'}},h('div',{style:{fontSize:'3.2rem'},'aria-hidden':'true'},s[0]),h('p',{class:'fb info'},t('fl_feel',L(s[2]))),h('p',null,h('b',null,t('fl_q')))),
        opts:idx.map(k=>s[3][k]),ans:idx.indexOf(s[4]),why:idx.map(k=>s[6][k]),explain:()=>L(s[5])+' '+t('fl_remind'),hint:()=>t('fl_hint')}},
      onDone:res=>api.complete({stars:Quiz.stars(res),key:'main',summary:()=>t('fl_done'),onContinue:intro})})}
  intro()}
